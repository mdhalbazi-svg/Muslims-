
name: Islamic Life Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java and Gradle Environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          which java
          which javac

      - name: Install Android SDK Packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Project Files
        run: |
          test -f package.json || {
            echo "ERROR: package.json missing. Extract the complete app ZIP into repository root."
            exit 1
          }

          test -f capacitor.config.json || {
            echo "ERROR: capacitor.config.json missing"
            exit 1
          }

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Web App
        run: npm run build

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Verify Android Gradle Java
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --stop
          ./gradlew --version

      - name: Build APK and AAB
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Upload Build Files
        uses: actions/upload-artifact@v4
        with:
          name: Islamic-Life-Android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          
